<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brightside Goldens</title>
    <script>
      (function () {
        var repoBase = '/brightside-goldens/';
        var pathname = window.location.pathname;
        var path = pathname.indexOf(repoBase) === 0 ? pathname.slice(repoBase.length) : pathname;
        var search = window.location.search ? window.location.search.slice(1).replace(/&/g, '~and~') : '';
        var hash = window.location.hash || '';
        var query = '?p=' + encodeURIComponent(path);

        if (search) {
          query += '&q=' + search;
        }

        window.location.replace(repoBase + query + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
