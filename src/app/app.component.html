<div class="site-shell">
  <header class="site-header" [class.admin-header-layout]="isAdminRoute">
    <div class="header-copy">
      <a routerLink="/" class="brand-mark">
        {{ isAdminRoute ? 'Brightside Goldens - Site Content editor' : ((siteContent$ | async)?.brand || 'Brightside Goldens') }}
      </a>
      <p class="brand-tagline" *ngIf="!isAdminRoute && (siteContent$ | async)?.tagline as tagline">
        {{ tagline }}
      </p>
    </div>

    <nav class="site-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/puppies" routerLinkActive="active">Puppies</a>
      <a routerLink="/our-boys" routerLinkActive="active">Our Boys</a>
      <a routerLink="/our-girls" routerLinkActive="active">Our Girls</a>
      <a *ngIf="showAdminLink" routerLink="/brightside-studio" routerLinkActive="active">Admin</a>
      <ng-container *ngIf="isAdminRoute">
        <a routerLink="/about-us" routerLinkActive="active">About Us</a>
        <a routerLink="/contact-us" routerLinkActive="active">Contact Us</a>
        <a routerLink="/faqs" routerLinkActive="active">FAQs</a>
      </ng-container>
    </nav>
  </header>

  <main class="site-content">
    <router-outlet></router-outlet>
  </main>
</div>
