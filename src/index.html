<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brightside Goldens</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Brightside Goldens shares available litters, care details, and happy updates."
    />
  </head>
  <body>
    <script>
      (function () {
        function getBasePath(pathname) {
          return pathname.indexOf('/brightside-goldens/') === 0 ? '/brightside-goldens/' : '/';
        }

        var redirect = window.location.search.match(/[?&]p=([^&]+)/);
        var query = window.location.search.match(/[?&]q=([^&]+)/);

        if (!redirect) {
          return;
        }

        var path = decodeURIComponent(redirect[1]).replace(/~and~/g, '&');
        var basePath = getBasePath(window.location.pathname);
        var cleanUrl = window.location.origin + basePath + path.replace(/^\/+/, '');

        if (query) {
          cleanUrl += '?' + decodeURIComponent(query[1]).replace(/~and~/g, '&');
        }

        window.history.replaceState(null, '', cleanUrl);
      })();
    </script>
    <script src="env.js"></script>
    <app-root></app-root>
  </body>
</html>
